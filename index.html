<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="Liquidation Inventory Intelligence — Upload, normalize, and analyze inventory Excel files with Category → Brand → Product → Variant drill-down.">
  <title>Liquidation Inventory Intelligence</title>

  <!-- Design System + Components -->
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/components.css">

  <!-- Google Fonts (with fallback) -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<div class="app-shell">

  <!-- ── MOBILE BACKDROP ────────────────────────────────────── -->
  <div class="sidebar-backdrop" id="sidebar-backdrop" onclick="App.UI.closeMobileMenu()"></div>

  <!-- ── SIDEBAR ────────────────────────────────────────────── -->
  <aside class="sidebar" id="sidebar">

    <div class="sidebar-logo">
      <div class="sidebar-logo-icon">📦</div>
      <div>
        <div class="sidebar-logo-text">Liquidation IQ</div>
        <div class="sidebar-logo-sub">Inventory Intelligence</div>
      </div>
    </div>

    <nav class="sidebar-nav" id="sidebar-nav">
      <!-- Populated by app.js renderSidebar() -->
      <div class="flex items-center gap-12" style="padding:16px 8px">
        <div class="spinner"></div><span class="text-muted text-xs">Loading…</span>
      </div>
    </nav>

    <div class="sidebar-footer">
      <div class="dataset-selector" id="dataset-selector" onclick="App.Router.go('uploads')">
        <div class="dataset-selector-label">Dataset</div>
        <div class="dataset-selector-name" style="color:var(--text-muted)">No file loaded</div>
      </div>
    </div>

  </aside>

  <!-- ── MAIN WRAPPER ───────────────────────────────────────── -->
  <div class="main-wrapper">

    <!-- ── TOPBAR ──────────────────────────────────────────── -->
    <header class="topbar">

      <!-- Mobile Hamburger Button -->
      <button class="mobile-menu-btn" id="mobile-menu-btn" onclick="App.UI.toggleMobileMenu()" aria-label="Toggle Navigation Menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>

      <!-- Dedicated Back Button -->
      <button class="btn btn-secondary btn-sm" id="topbar-back-btn" onclick="App.Router.back()" title="Go to previous page" style="display:none;align-items:center;gap:6px;padding:5px 12px;font-size:12px;font-weight:600;flex-shrink:0">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="19" y1="12" x2="5" y2="12"/>
          <polyline points="12 19 5 12 12 5"/>
        </svg>
        Back
      </button>

      <!-- Breadcrumb -->
      <div class="topbar-breadcrumb" id="breadcrumb">
        <span class="breadcrumb-item active">Dashboard</span>
      </div>

      <!-- Global Search -->
      <div class="topbar-search" style="position:relative">
        <div class="topbar-search-icon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </div>
        <input type="text" class="input" id="global-search" placeholder="Search products, brands…" autocomplete="off">
        <div id="search-results-dropdown" class="search-dropdown-menu"></div>
      </div>

      <!-- Actions -->
      <div class="topbar-actions flex gap-8 items-center">
        <button class="btn btn-secondary" onclick="App.UI.exportDataset('csv')" title="Export Dataset to CSV">
          <span>📥</span> Export CSV
        </button>
        <button class="btn btn-secondary" onclick="App.UI.exportDataset('xlsx')" title="Export Dataset to XLSX">
          <span>📊</span> Export XLSX
        </button>
        <button class="btn btn-primary" onclick="App.UI.showUploadModal()" title="Upload Excel file">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          Upload
        </button>

        <!-- User Profile Control (Populated dynamically when authenticated) -->
        <div class="user-header-control" id="user-header-control"></div>
      </div>

    </header>

    <!-- ── MAIN CONTENT ────────────────────────────────────── -->
    <main class="main-content" id="main-content">
      <!-- Populated by router -->
      <div class="flex items-center justify-center" style="height:100%">
        <div class="text-center" style="opacity:0.4">
          <div style="font-size:48px;margin-bottom:12px">📦</div>
          <div class="text-lg font-semibold">Initializing…</div>
        </div>
      </div>
    </main>

  </div><!-- /main-wrapper -->

</div><!-- /app-shell -->

<!-- ── VENDOR LIBRARIES (local, offline-safe) ───────────────── -->
<script src="vendor/xlsx.full.min.js"></script>
<script src="vendor/fuse.min.js"></script>
<script src="vendor/chart.umd.min.js"></script>

<!-- ── FIREBASE WEB SDK (v10.12.0) ────────────────────────── -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

<!-- ── FIREBASE CONFIG & AUTH SERVICE ──────────────────────── -->
<script src="js/config/firebase.js?v=4.0"></script>
<script src="js/services/auth.js?v=4.0"></script>

<!-- ── CORE UTILS ──────────────────────────────────────────── -->
<script src="js/utils/formatters.js?v=4.0"></script>
<script src="js/utils/nlEngine.js?v=4.0"></script>
<script src="js/utils/exporter.js?v=4.0"></script>

<!-- ── DATABASE ────────────────────────────────────────────── -->
<script src="js/db.js?v=4.0"></script>

<!-- ── PIPELINE (order matters) ────────────────────────────── -->
<script src="js/pipeline/validator.js?v=4.0"></script>
<script src="js/pipeline/parser.js?v=4.0"></script>
<script src="js/pipeline/cleaner.js?v=4.0"></script>
<script src="js/pipeline/categorizer.js?v=4.0"></script>
<script src="js/pipeline/brandEngine.js?v=4.0"></script>
<script src="js/pipeline/productEngine.js?v=4.0"></script>
<script src="js/pipeline/aggregator.js?v=4.0"></script>
<script src="js/pipeline/reportingMapper.js?v=4.0"></script>
<script src="js/pipeline/inventoryStatusResolver.js?v=4.0"></script>
<script src="js/pipeline/pipeline.js?v=4.0"></script>

<!-- ── VIEWS ───────────────────────────────────────────────── -->
<script src="js/views/landing.js?v=4.0"></script>
<script src="js/views/login.js?v=4.0"></script>
<script src="js/views/signup.js?v=4.0"></script>
<script src="js/views/forgotPassword.js?v=4.0"></script>
<script src="js/views/dashboard.js?v=4.0"></script>
<script src="js/views/categoryDetail.js?v=4.0"></script>
<script src="js/views/brandDetail.js?v=4.0"></script>
<script src="js/views/warehouseView.js?v=4.0"></script>
<script src="js/views/dataQuality.js?v=4.0"></script>
<script src="js/views/uploadsHistory.js?v=4.0"></script>
<script src="js/views/nlQuery.js?v=4.0"></script>
<script src="js/views/about.js?v=4.0"></script>

<!-- ── MAIN APP (last — initializes everything) ────────────── -->
<script src="js/app.js?v=4.0"></script>

<!-- Chart.js global defaults -->
<script>
  if (typeof Chart !== 'undefined') {
    Chart.defaults.color = '#64748b';
    Chart.defaults.font.family = 'Inter, sans-serif';
    Chart.defaults.font.size   = 12;
    Chart.defaults.borderColor = '#1a1d28';
    Chart.defaults.plugins.tooltip.backgroundColor = '#22262f';
    Chart.defaults.plugins.tooltip.borderColor     = '#2d3244';
    Chart.defaults.plugins.tooltip.borderWidth     = 1;
    Chart.defaults.plugins.tooltip.padding         = 10;
    Chart.defaults.plugins.tooltip.titleColor      = '#f1f5f9';
    Chart.defaults.plugins.tooltip.bodyColor       = '#94a3b8';
    Chart.defaults.plugins.legend.labels.color     = '#94a3b8';
  }
</script>

</body>
</html>
