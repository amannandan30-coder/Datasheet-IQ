<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="full_dGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="45%" stop-color="#2563eb" />
      <stop offset="80%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="full_cyanEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="full_sheetFold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="full_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#06b6d4" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Logo Mark (Left) -->
  <g transform="translate(15, 20) scale(1.15)">
    <!-- Monogram D -->
    <path d="M 22 14 C 22 10 26 6 30 6 L 62 6 C 90 6 110 24 110 60 C 110 96 90 114 62 114 L 30 114 C 26 114 22 110 22 106 Z" 
          fill="url(#full_dGrad)" filter="url(#full_glow)" />

    <!-- Sheet -->
    <g transform="translate(30, 20)">
      <path d="M 4 4 C 4 1.8 5.8 0 8 0 L 38 0 L 52 14 L 52 74 C 52 76.2 50.2 78 48 78 L 8 78 C 5.8 78 4 76.2 4 74 Z" fill="#ffffff" />
      <path d="M 38 0 L 38 14 L 52 14 Z" fill="url(#full_sheetFold)" />
      <rect x="10" y="24" width="12" height="8" rx="2" fill="#10b981" />
      <rect x="10" y="36" width="12" height="8" rx="2" fill="#10b981" />
      <rect x="10" y="48" width="12" height="8" rx="2" fill="#10b981" />
      <rect x="10" y="60" width="12" height="8" rx="2" fill="#10b981" />
      <rect x="26" y="24" width="18" height="8" rx="2" fill="#0f172a" fill-opacity="0.15" />
      <rect x="26" y="36" width="14" height="8" rx="2" fill="#0f172a" fill-opacity="0.15" />
      <rect x="26" y="48" width="8" height="8" rx="2" fill="#0f172a" fill-opacity="0.15" />
    </g>

    <!-- Lens -->
    <g transform="translate(56, 48)">
      <line x1="30" y1="30" x2="48" y2="48" stroke="url(#full_cyanEmerald)" stroke-width="8" stroke-linecap="round" />
      <circle cx="20" cy="20" r="18" fill="#0b1329" stroke="#ffffff" stroke-width="4.5" />
      <rect x="12" y="22" width="3.5" height="8" rx="1.5" fill="#34d399" />
      <rect x="18" y="15" width="3.5" height="15" rx="1.5" fill="#10b981" />
      <rect x="24" y="9" width="3.5" height="21" rx="1.5" fill="#059669" />
    </g>
  </g>

  <!-- Wordmark & Tagline (Right) -->
  <g transform="translate(170, 0)">
    <!-- Wordmark: "DataSheet" in White + "IQ" in Cyan/Emerald -->
    <text x="0" y="96" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      DataSheet<tspan fill="url(#full_cyanEmerald)">IQ</tspan>
    </text>

    <!-- Tagline: "— Inventory Intelligent —" -->
    <g transform="translate(5, 138)">
      <line x1="0" y1="-5" x2="30" y2="-5" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
      <text x="44" y="0" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#34d399" letter-spacing="4.5">
        INVENTORY INTELLIGENT
      </text>
      <line x1="322" y1="-5" x2="352" y2="-5" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
    </g>
  </g>
</svg>
