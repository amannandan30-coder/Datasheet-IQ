<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background / Monogram D Gradients -->
    <linearGradient id="dGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="45%" stop-color="#2563eb" />
      <stop offset="80%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="cyanEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="sheetFold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#06b6d4" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Main Monogram "D" Contour -->
  <path d="M 22 14 C 22 10 26 6 30 6 L 62 6 C 90 6 110 24 110 60 C 110 96 90 114 62 114 L 30 114 C 26 114 22 110 22 106 Z" 
        fill="url(#dGrad)" filter="url(#subtleGlow)" />

  <!-- White Document Sheet -->
  <g transform="translate(30, 20)">
    <!-- Sheet base with folded corner -->
    <path d="M 4 4 C 4 1.8 5.8 0 8 0 L 38 0 L 52 14 L 52 74 C 52 76.2 50.2 78 48 78 L 8 78 C 5.8 78 4 76.2 4 74 Z" 
          fill="#ffffff" />
    <!-- Folded Corner Flap -->
    <path d="M 38 0 L 38 14 L 52 14 Z" fill="url(#sheetFold)" />

    <!-- Spreadsheet Data Cells (Left Column: Emerald Cells) -->
    <rect x="10" y="24" width="12" height="8" rx="2" fill="#10b981" />
    <rect x="10" y="36" width="12" height="8" rx="2" fill="#10b981" />
    <rect x="10" y="48" width="12" height="8" rx="2" fill="#10b981" />
    <rect x="10" y="60" width="12" height="8" rx="2" fill="#10b981" />

    <!-- Spreadsheet Data Rows (Right Column: Subtle Navy/Teal Grid Rows) -->
    <rect x="26" y="24" width="18" height="8" rx="2" fill="#0f172a" fill-opacity="0.15" />
    <rect x="26" y="36" width="14" height="8" rx="2" fill="#0f172a" fill-opacity="0.15" />
    <rect x="26" y="48" width="8" height="8" rx="2" fill="#0f172a" fill-opacity="0.15" />
  </g>

  <!-- Magnifying Glass with Chart Overlay -->
  <g transform="translate(56, 48)">
    <!-- Cyan/Emerald Handle pointing down-right -->
    <line x1="30" y1="30" x2="48" y2="48" stroke="url(#cyanEmerald)" stroke-width="8" stroke-linecap="round" />
    
    <!-- Lens Outer Ring -->
    <circle cx="20" cy="20" r="18" fill="#0b1329" stroke="#ffffff" stroke-width="4.5" />
    
    <!-- 3-Bar Analytics Chart inside Lens -->
    <rect x="12" y="22" width="3.5" height="8" rx="1.5" fill="#34d399" />
    <rect x="18" y="15" width="3.5" height="15" rx="1.5" fill="#10b981" />
    <rect x="24" y="9" width="3.5" height="21" rx="1.5" fill="#059669" />
  </g>
</svg>
